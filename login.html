<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: url("https://images.unsplash.com/photo-1667318749529-117b0b9e0be0?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzR8fDRrJTIwYmFja2dyb3VuZHxlbnwwfHwwfHx8MA%3D%3D");
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.166);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 1px 4px 20px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .login-container input {
      background-color: rgba(255, 255, 255, 0.844);
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.844);
    }

    .login-container input:hover {
      border: 1px solid rgb(0, 0, 0);
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2575fc;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-container button:hover {
      background: #1a5ed6;
    }

    .login-container p {
      margin-top: 15px;
      font-size: 14px;
    }

    .login-container a {
      color: #005eff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login Please!</h2>
    <form id="loginForm">
      <input type="text" id="login-user-name" placeholder="Enter Username" required />
      <input type="password" id="login-user-password" placeholder="Enter Password" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const loginUserName = document.getElementById("login-user-name").value.trim();
      const loginUserPassword = document.getElementById("login-user-password").value.trim();

      const users = JSON.parse(localStorage.getItem("users")) || [];

      if (users.length === 0) {
        alert("No users found. Please register first.");
        return;
      }

      const foundUser = users.find(user => user.name === loginUserName);

      if (!foundUser) {
        alert("Username not found.");
        return;
      }

      if (foundUser.password !== loginUserPassword) {
        alert("Incorrect password.");
        return;
      }

      alert("Login successful!");
      window.location.href = "dash.html"; // change as needed
    });
  </script>
</body>
</html>

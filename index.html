<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: url("https://images.unsplash.com/photo-1667318749529-117b0b9e0be0?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzR8fDRrJTIwYmFja2tncm91bmR8ZW58MHx8MHx8");
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.166);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 1px 4px 20px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .login-container input {
      background-color: rgba(255, 255, 255, 0.844);
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.844);
    }

    .login-container input:hover {
      border: 1px solid rgb(0, 0, 0);
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #2575fc;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .login-container button:hover {
      background: #1a5ed6;
    }

    .login-container p {
      margin-top: 15px;
      font-size: 14px;
    }

    .login-container a {
      color: #005eff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Create Account</h2>
    <form id="contactForm">
      <input type="text" id="name" placeholder="Create a Username" required />
      <input type="password" id="password" placeholder="Create a Password" required />
      <input type="email" id="email" placeholder="Enter email" required />
      <button type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
    const form = document.getElementById("contactForm");

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const password = document.getElementById("password").value.trim();
      const email = document.getElementById("email").value.trim();

      // Input validation
      if (!name || !password || !email) {
        alert("All fields are required!");
        return;
      }

      if (!/^[A-Z]/.test(name)) {
        alert("Name must start with a capital letter");
        return;
      }

      if (!email.endsWith("@gmail.com")) {
        alert("Email must end with @gmail.com");
        return;
      }

      if (password.length <= 8) {
        alert("Password must be greater than 8 characters");
        return;
      }

      let users = JSON.parse(localStorage.getItem('users')) || [];

      const existingUser = users.find(user => user.email === email);
      if (existingUser) {
        alert("Email is already registered.");
        return;
      }

      const newUser = { name, email, password };
      users.push(newUser);
      localStorage.setItem("users", JSON.stringify(users));

      // Redirect after signup
      alert("Signup successful!");
      window.location.assign("login.html"); // safer than href after alert
    });
  </script>
</body>
</html>
